[workspace]
resolver = "3"
members = ["gateway", "server", "sandbox"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Vinisilva0010/Agent-orchestration."

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Keep only line tables in debug builds to reduce memory use while compiling.
[profile.dev]
debug = "line-tables-only"
