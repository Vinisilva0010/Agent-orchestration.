name: Rust

on:
  push:
    branches: [main]
    paths-ignore: ["web/**", "**/*.md"]
  pull_request:
    paths-ignore: ["web/**", "**/*.md"]
  # New advisories appear without any change here, so check them weekly too.
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5 # postgres:18-alpine, same digest as compose.dev.yaml
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway CI database, never reachable outside the job.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          rustup default 1.98.1
      - name: Cache compiled dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-1.98.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-1.98.1-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: scripts/attack-suite.sh

  rust-dependencies:
    name: Rust dependencies (cargo deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
