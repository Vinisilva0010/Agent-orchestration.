# Weekly dependency update checks. Every update arrives as a pull request
# and must pass CI before it is merged.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades of the web toolchain (TypeScript, ESLint, Next.js,
      # Node type definitions) break each other and are done by hand, tested
      # with the interface work in Phase 4. TypeScript 7.0 broke the build.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
