# Weekly dependency update checks. Every update arrives as a pull request
# and must pass CI before it is merged.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /agents
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # uv_build must match the installed uv version, so uv uses its built-in
      # backend instead of downloading uv_build from PyPI. Bump it together with uv.
      - dependency-name: "uv-build"

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node type definitions must match the Node.js runtime (22.x).
      # Bump the major version only together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
